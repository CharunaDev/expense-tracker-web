<div class="animate-in">

  <!-- Page Header -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Categories</h1>
      <p class="page-subtitle">Organize your transactions</p>
    </div>
    <button (click)="openCategoryModal()" class="btn btn-primary">
      <i class="pi pi-plus"></i>
      <span>Add</span>
    </button>
  </div>

  <!-- ── Tabs ── -->
  <div class="tab-bar">
    <button class="tab-item"
            [class.tab-item--active]="activeTab === 'expense'"
            (click)="activeTab = 'expense'; filterCategories()">
      <i class="pi pi-arrow-down" style="font-size:14px;"></i>
      Expenses
    </button>
    <button class="tab-item"
            [class.tab-item--active]="activeTab === 'income'"
            (click)="activeTab = 'income'; filterCategories()">
      <i class="pi pi-arrow-up" style="font-size:14px;"></i>
      Incomes
    </button>
  </div>

  <!-- ── Category Grid ── -->
  <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;" *ngIf="filteredCategories.length > 0">
    <div *ngFor="let cat of filteredCategories" class="card card-sm">
      <div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">
        <div style="display:flex; align-items:center; gap:10px; min-width:0;">
          <div class="txn-icon"
               style="width:36px; height:36px; font-size:14px; flex-shrink:0;"
               [class.icon-red]="cat.type === 'expense'"
               [class.icon-green]="cat.type === 'income'">
            <i class="pi" [class.pi-arrow-down]="cat.type === 'expense'" [class.pi-arrow-up]="cat.type === 'income'"></i>
          </div>
          <div style="min-width:0;">
            <div style="font-weight:700; font-size:13px; color:var(--gray-900); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">{{ cat.name }}</div>
            <div style="font-size:11px; color:var(--gray-400); text-transform:capitalize;">{{ cat.type }}</div>
          </div>
        </div>
        <div style="display:flex; gap:2px; flex-shrink:0;">
          <button (click)="editCategory(cat)" class="btn-icon" style="width:28px; height:28px;" aria-label="Edit">
            <i class="pi pi-pencil" style="font-size:12px; color:var(--brand-500);"></i>
          </button>
          <button (click)="deleteCategory(cat.id)" class="btn-icon" style="width:28px; height:28px;" aria-label="Delete">
            <i class="pi pi-trash" style="font-size:12px; color:var(--danger-text);"></i>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Empty -->
  <div *ngIf="filteredCategories.length === 0" class="card">
    <div class="empty-state">
      <div class="empty-state__icon"><i class="pi pi-tags"></i></div>
      <div class="empty-state__title">No {{ activeTab }} categories</div>
      <div class="empty-state__desc">Create categories to organize transactions</div>
      <button (click)="openCategoryModal()" class="btn btn-primary">
        <i class="pi pi-plus"></i> Add Category
      </button>
    </div>
  </div>

</div>

<!-- ══════════════════════════════════════════
     CATEGORY MODAL
══════════════════════════════════════════ -->
<div *ngIf="showModal" class="modal-overlay" (click)="closeModalOnBackdrop($event)">
  <div class="modal-sheet">
    <div class="modal-handle"></div>

    <div class="modal-header">
      <h3 class="modal-title">{{ editingCategory ? 'Edit Category' : 'New Category' }}</h3>
      <button (click)="closeModal()" class="btn-icon" aria-label="Close">
        <i class="pi pi-times"></i>
      </button>
    </div>

    <form [formGroup]="categoryForm" (ngSubmit)="saveCategory()">
      <div class="modal-body">

        <div class="form-group">
          <label class="form-label">Category Name *</label>
          <input type="text" formControlName="name" class="form-control" placeholder="e.g. Groceries, Salary, Rent">
        </div>

        <div class="form-group" style="margin-bottom:0;">
          <label class="form-label">Type *</label>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:4px;">
            <label style="display:flex; align-items:center; gap:10px; padding:14px; border-radius:var(--radius-sm); border:1.5px solid; cursor:pointer; transition:all 0.15s;"
                   [style.border-color]="categoryForm.get('type')?.value === 'expense' ? 'var(--danger-500)' : 'var(--gray-200)'"
                   [style.background]="categoryForm.get('type')?.value === 'expense' ? 'var(--danger-bg)' : 'var(--surface-input)'">
              <input type="radio" value="expense" formControlName="type" style="display:none;">
              <i class="pi pi-arrow-down" [style.color]="categoryForm.get('type')?.value === 'expense' ? 'var(--danger-text)' : 'var(--gray-400)'"></i>
              <span style="font-size:14px; font-weight:600;"
                    [style.color]="categoryForm.get('type')?.value === 'expense' ? 'var(--danger-text)' : 'var(--gray-600)'">Expense</span>
            </label>

            <label style="display:flex; align-items:center; gap:10px; padding:14px; border-radius:var(--radius-sm); border:1.5px solid; cursor:pointer; transition:all 0.15s;"
                   [style.border-color]="categoryForm.get('type')?.value === 'income' ? 'var(--success-500)' : 'var(--gray-200)'"
                   [style.background]="categoryForm.get('type')?.value === 'income' ? 'var(--success-bg)' : 'var(--surface-input)'">
              <input type="radio" value="income" formControlName="type" style="display:none;">
              <i class="pi pi-arrow-up" [style.color]="categoryForm.get('type')?.value === 'income' ? 'var(--success-text)' : 'var(--gray-400)'"></i>
              <span style="font-size:14px; font-weight:600;"
                    [style.color]="categoryForm.get('type')?.value === 'income' ? 'var(--success-text)' : 'var(--gray-600)'">Income</span>
            </label>
          </div>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" (click)="closeModal()" class="btn btn-ghost">Cancel</button>
        <button type="submit" class="btn btn-primary" [disabled]="categoryForm.invalid">
          {{ editingCategory ? 'Update' : 'Save Category' }}
        </button>
      </div>
    </form>
  </div>
</div>
